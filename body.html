<div class="main-wrap">
  <div class="panel active" id="panel-balita">
    </div>
  </div>

<script>
  // 1. Konfigurasi Database (Sekarang di body.html sesuai permintaan)
  const DATA_BASE_URL = 'https://cdn.jsdelivr.net/gh/Rezaariandes/bantu-ibu@main';
  const DATA_URLS = {
    zscore:    DATA_BASE_URL + '/zscore.json',
    edukasi:   DATA_BASE_URL + '/edukasi.json',
    imunisasi: DATA_BASE_URL + '/imunisasi.json',
    pkg:       DATA_BASE_URL + '/pkg.json'
  };

  // Variabel penampung data
  let dataZscore, dataEdukasi, dataImunisasi, dataPkg;

  // 2. Fungsi memuat data JSON secara otomatis
  async function loadDatabase() {
    try {
      const [z, e, i, p] = await Promise.all([
        fetch(DATA_URLS.zscore).then(r => r.json()),
        fetch(DATA_URLS.edukasi).then(r => r.json()),
        fetch(DATA_URLS.imunisasi).then(r => r.json()),
        fetch(DATA_URLS.pkg).then(r => r.json())
      ]);
      
      dataZscore = z;
      dataEdukasi = e;
      dataImunisasi = i;
      dataPkg = p;

      // Inisialisasi tampilan setelah data siap
      renderTabelImunisasi();
      console.log("Database berhasil dimuat ke body.html");
    } catch (err) {
      console.error("Gagal memuat database JSON:", err);
    }
  }

  // 3. Logika perhitungan dan navigasi
  function renderTabelImunisasi() {
    const tbody = document.querySelector('#tabel-imunisasi-static tbody');
    if (!tbody || !dataImunisasi) return;
    tbody.innerHTML = dataImunisasi.tabelLengkap.map(row =>
      `<tr><td><span class="badge-imun">${row.usia}</span></td><td>${row.vaksin}</td><td>${row.penyakit}</td></tr>`
    ).join('');
    const note = document.getElementById('catatan-suplemen');
    if (note) note.textContent = dataImunisasi.catatanSuplemen;
  }

  function prosesHasil() {
    if (!dataZscore) { alert("Data medis sedang dimuat..."); return; }
    
    const jk = document.getElementById('jk').value;
    const usia = parseInt(document.getElementById('usia').value);
    const bb = parseFloat(document.getElementById('bb').value);
    // ... (lanjutkan logika prosesHasil anda di sini) ...
    
    // Contoh penggunaan dataZscore yang sudah dimuat:
    const tabel = jk === 'L' ? dataZscore.zscore_L : dataZscore.zscore_P;
    // ... dst
    
    document.getElementById('output-empty').style.display = 'none';
    document.getElementById('output').style.display = 'block';
  }

  function switchTab(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // Jalankan pengambilan data segera setelah fragmen ini masuk ke halaman
  loadDatabase();
</script>
